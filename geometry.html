<!DOCTYPE html>
<html lang="en-US">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/gdlite/">
  <title>Geometry Dash</title>
  <link rel="stylesheet" href="/autoclicker.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: linear-gradient(#000, #0066ff); }
    #gameContainer { width: 100vw; height: calc(100vh - 36px); margin-top: 36px; }
    canvas { display: block; width: 100%; height: 100%; }
    #homeLink {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 4;
      height: 36px;
      padding: 10px 14px;
      color: #fff;
      background: rgba(0, 0, 0, .8);
      font: 600 12px sans-serif;
      text-decoration: none;
    }
    #loader {
      position: fixed;
      inset: 36px 0 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(#000, #0066ff);
      color: #fff;
      font: 600 13px sans-serif;
    }
    #loader[hidden] { display: none; }
    .logo { display: block; width: min(420px, 82vw); max-height: 55vh; object-fit: contain; }
    .progress { width: min(436px, 78vw); height: 14px; padding: 2px; border: 1px solid rgba(255,255,255,.7); }
    .full { width: 0; height: 100%; transform: scaleX(0); transform-origin: left center; background: #fff; }
    #loadError { max-width: 32rem; margin: 0 20px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <a id="homeLink" href="/index.html">Back to Hoilday</a>
  <div id="gameContainer"></div>
  <div id="loader" role="status" aria-live="polite">
    <img class="logo" src="image/loading.png?v=1" alt="Loading Geometry Dash">
    <div class="progress" hidden><div class="full"></div></div>
    <span id="loadingText">Loading Geometry Dash...</span>
    <p id="loadError" hidden></p>
  </div>
  <script>
    function showGameError(message) {
      const error = document.querySelector('#loadError');
      document.querySelector('#loadingText').hidden = true;
      error.textContent = message;
      error.hidden = false;
    }
    window.addEventListener('error', (event) => {
      if (event.target instanceof HTMLScriptElement) {
        showGameError('A game script could not load. Check the connection and reload.');
      } else if (event.message) {
        showGameError('The game failed to start. Reload the page to try again.');
      }
    }, true);
    window.fileMergerConfig = {
      files: [
        { name: 'GeometryDashLite.data.unityweb', parts: 2 },
        { name: 'GeometryDashLite.wasm.code.unityweb', parts: 1 },
        { name: 'GeometryDashLite.wasm.framework.unityweb', parts: 1 }
      ],
      basePath: 'Build/',
      debug: true
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@ac5cdfc0042aca584e72619375b4aca948a9243c/merge.js" onerror="showGameError('The game merger could not load. Check the connection and reload.')"></script>
  <script src="Build/UnityLoader.js" onerror="showGameError('The Unity loader could not load. Check the connection and reload.')"></script>
  <script>
    const loader = document.querySelector('#loader');
    const progressTrack = loader.querySelector('.progress');
    const progressFill = loader.querySelector('.full');

    try {
      UnityLoader.instantiate('gameContainer', 'Build/GeometryDashLite.json', {
        onProgress: (gameInstance, progress) => {
          if (!gameInstance.Module) return;
          progressTrack.hidden = false;
          progressFill.style.transform = `scaleX(${progress})`;
          if (progress === 1 && !gameInstance.removeTimeout) {
            gameInstance.removeTimeout = window.setTimeout(() => {
              loader.hidden = true;
            }, 1200);
          }
        }
      });
    } catch {
      showGameError('The game failed to start. Reload the page to try again.');
    }
  </script>
  <script>
    const sessionToken = localStorage.getItem('dayglow-server-session');
    async function pingPresence() {
      if (!sessionToken) return;
      const app = document.visibilityState === 'visible' && document.hasFocus()
        ? 'geometry-dash'
        : undefined;
      try {
        await fetch('/api/presence/ping', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${sessionToken}`
          },
          body: JSON.stringify({ app })
        });
      } catch {}
    }
    void pingPresence();
    window.setInterval(pingPresence, 5000);
  </script>
  <script type="module" src="/autoclicker.js"></script>
</body>
</html>
